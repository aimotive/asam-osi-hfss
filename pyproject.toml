[project]
name = "osi-hfss"
version = "0.0.1"
description = "Draft proposal: high-fidelity, polarimetric antenna model for the ASAM OSI radar interface"
requires-python = "== 3.12.*"
dependencies = [
    "numpy == 2.5.*",
    "jupyter == 1.1.*",
    "matplotlib == 3.11.*",
    "protobuf == 7.36.*",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "grpcio-tools == 1.84.*",
]
